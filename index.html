<!--
  技術士 問題Ⅰドリル（四択）
  RCCM択一 配布版（rccm-takuitsu-web 2026-09-03）の形式を流用して新しく作ったもの。RCCM側のファイルとは別物。
  v4（2026-11-11）：段階（6段階）／診断／今日のメニュー（弱い論点・間違えた問題・新しい問題を自動で混ぜる）／
                    段階の合格判定（別の日に2回、80%以上）／仮通過／タブのアイコン
  v2（2026-11-10）：選択肢の並べ替え（解説の番号も連動）／セット単位の出題順／論点別の集計／
                    先に自分で考えるモード／間違えた問題の復習／記録のCSV保存／【条件】行の強調
  データ：data/manifest.json と data/*.json（スプレッドシートのGAS「ExportDrill.gs」で書き出す）
-->
<style>
  :root{
    /* ===== 表示設定（基本はここ2つだけ変えればOK） ===== */
    --font:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; /* 書体 */
    --fs:16px;   /* 文字の基本サイズ */
    /* ================================================= */
    --bg:#f4f6f8; --card:#fff; --ink:#1f2933; --sub:#52606d; --line:#e4e7eb;
    --brand:#1565c0; --brand-d:#0d47a1; --ok:#00a83a; --ok-bg:#c8f5d4;
    --ng:#c62828; --ng-bg:#ffebee;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  html{font-size:var(--fs)}
  body{font-family:var(--font);font-size:1rem;
    background:var(--bg);color:var(--ink);line-height:1.7;-webkit-text-size-adjust:100%}
  /* 透かし（抑止用・操作を邪魔しない） */
  #wm{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.06}
  #wm div{position:absolute;white-space:nowrap;font-size:26px;font-weight:700;color:#000;
    transform:rotate(-30deg)}

  /* 青帯：画面上部に固定。長い解説でもスクロールせずに「戻る」「次へ」が押せる */
  header{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding:10px 16px;
    box-shadow:0 1px 4px rgba(0,0,0,.18)}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
    max-width:760px;margin:0 auto}
  header h1{font-size:1.06rem;margin:0;font-weight:700}
  .fsctl{display:flex;gap:6px;flex:none}
  .fsctl button,.hnav button{padding:4px 9px;font-size:13px;line-height:1.2;border-radius:8px;
    border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.14);color:#fff;-webkit-appearance:none}
  .fsctl button:active,.hnav button:active{background:rgba(255,255,255,.30)}
  .fsctl #fsPlus{font-size:15px}
  .hnav{display:flex;align-items:center;gap:10px;max-width:760px;margin:8px auto 0}
  .hnav[hidden]{display:none}
  .hnav button{font-size:15px;font-weight:700;padding:7px 14px;min-width:6.2em;transition:none}
  .hnav #hNext{background:#fff;color:var(--brand-d);border-color:#fff}
  .hnav #hNext:disabled{background:rgba(255,255,255,.14);color:rgba(255,255,255,.55);border-color:rgba(255,255,255,.35)}
  .hnav .hpos{flex:1;text-align:center;font-size:0.94rem;font-weight:700;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:34px}
  .crumb{font-size:0.82rem;color:var(--sub)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
  .grid{display:flex;flex-direction:column;gap:10px}
  button{font-family:inherit;font-size:0.94rem;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;transition:.12s;-webkit-appearance:none;appearance:none}
  @media (hover:hover) and (pointer:fine){
    button:hover{border-color:var(--brand)}
  }
  .menu-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;font-weight:600;width:100%}
  .menu-btn .sub{font-weight:400;color:var(--sub);font-size:0.82rem;text-align:right}
  .menu-btn .stat{display:block;font-weight:400;color:var(--sub);font-size:0.78rem}
  .menu-btn.empty{color:var(--sub)}
  .grp{font-size:0.82rem;color:var(--brand-d);font-weight:700;margin:6px 0 -2px}
  .catrow{display:grid;grid-template-columns:1fr auto 3.1em 3.1em 3.1em;gap:6px;align-items:center;
    width:100%;text-align:left;padding:11px 12px}
  .catrow .cname{font-weight:600}
  .catrow .cdate{display:block;font-weight:400;color:var(--sub);font-size:0.75rem}
  .catrow .ccount{color:var(--sub);font-size:0.82rem;justify-self:end;white-space:nowrap}
  .catrow .acc{justify-self:end;font-size:0.9rem;font-variant-numeric:tabular-nums}
  .catrow .acc.empty{color:var(--line)}
  .primary{background:var(--brand);color:#fff;border:none;font-weight:600}
  @media (hover:hover) and (pointer:fine){ .primary:hover{background:var(--brand-d)} }
  .ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  .navback{background:#fff;color:var(--brand-d);border:1px solid var(--brand-d);font-weight:700}
  @media (hover:hover) and (pointer:fine){ .navback:hover{background:#eef4fc} }

<script>
/* 端末への保存（Web移植時はここをサーバー保存に差し替える） */
var STORE=(function(){
  var P="drill1_";   // RCCM（rccm_）と混ざらないよう名前を分ける
  return {
    get:function(k,def){ try{ var v=localStorage.getItem(P+k); return v==null?def:JSON.parse(v); }catch(e){ return def; } },
    set:function(k,v){ try{ localStorage.setItem(P+k,JSON.stringify(v)); }catch(e){} },
    del:function(k){ try{ localStorage.removeItem(P+k); }catch(e){} }
  };
})();

/* 文字サイズ調整（A−/A＋/標準）。--fs を変え、端末に保存。 */
(function(){
  var root=document.documentElement, MIN=13, MAX=26;
  var DEFAULT=(getComputedStyle(root).getPropertyValue('--fs')||'16px').trim();
  function cur(){ var v=parseInt(getComputedStyle(root).getPropertyValue('--fs'),10); return isNaN(v)?16:v; }
  function set(px){ px=Math.max(MIN,Math.min(MAX,px)); root.style.setProperty('--fs',px+'px'); STORE.set("fs",px+'px'); }
  var s=STORE.get("fs",null); if(s) root.style.setProperty('--fs',s);
  document.getElementById('fsMinus').onclick=function(){ set(cur()-1); };
  document.getElementById('fsPlus').onclick=function(){ set(cur()+1); };
  document.getElementById('fsReset').onclick=function(){ root.style.setProperty('--fs',DEFAULT); STORE.del("fs"); };
})();
</script>

<script>
(function(){
  "use strict";

  /* ===================== ライセンス設定（配布ごとに書き換え） =====================
     ※ 静的配布のためクライアント側の「抑止」です（ソース閲覧で回避されうる）。 */
  var LICENSE = {
    name: "社内限定",   // 透かし表示
    accessCode: "",     // コード無し
    expiry: ""          // 期限無し（"YYYY-MM-DD" を入れるとその翌日からロック）
  };
  /* ============================================================================= */

  var BASE_CANDIDATES = ["", "../"];
  var DATA = { exam:"技術士 問題Ⅰドリル", parts:[] };
  var unlocked = false;

  var S = { screen:"boot", dept:null, partKey:null, catName:null,
            qIndex:0, view:"question", answers:{}, times:{}, timer:null, results:{},
            mode:"cat", qs:[], perms:{}, revealed:{}, reviewRes:null };
  var QMAP = {};          // 問題ID → 問題
  var REVIEW_MAX = 20;    // 復習1回あたりの問題数の上限

  /* ===================== 段階の設定（v4） =====================
     段階は、種別の名前で決まる。問題ごとに変えたいときだけ、スプレッドシートの「段階」列に 1〜6 を入れる。
     問題が0問の段階は「準備中」として飛ばす。 */
  var STAGES = [
    { no:1, name:"論理の基礎",     types:["論理の基礎"],               goal:"問題・課題・解決策を見分ける" },
    { no:2, name:"観点と課題",     types:["観点と課題"],               goal:"3つの課題を、重ならないように立てる" },
    { no:3, name:"解決策と説明文", types:["解決策出し","説明文の論理"], goal:"最も重要な課題に、解決策を出して説明する" },
    { no:4, name:"リスクと対策",   types:["リスクと対策"],             goal:"解決策から生じるリスクと、その対策を書く" },
    { no:5, name:"観点の構築",     types:["観点の構築"],               goal:"1題を通して、骨子を組む" },
    { no:6, name:"条件の読み替え", types:["条件の読み替え"],           goal:"条件が変わっても、組み直す" }
  ];
  var KNOW_TYPES = ["知識"];   // 段階に入れず、並行して出す種別
  var CFG = {
    PASS_PCT: 80,          // 合格の正答率（％）
    PASS_DAYS: 2,          // 合格日が何日そろえば、その段階を通過とするか（別の日）
    MIN_N: 8,              // 1日に何問以上解けば、その日を判定の対象にするか（段階の問題数が少なければ、その数）
    MENU_N: 15,            // 今日のメニューの問題数（連問を含むと、少し増えることがある）
    MIX_WEAK: 0.5,         // 弱い論点の割合
    MIX_RETRY: 0.3,        // 前に間違えた問題の割合（残りは、今の段階の新しい問題）
    KNOW_FROM: 2,          // 知識の問題を混ぜ始める段階
    DIAG_PER: 4,           // 診断で、1つの段階から出す問題数
    DIAG_PASS: 3,          // 診断で、何問正解ならその段階を通過とみなすか
    ESCAPE_AFTER_DAYS: 3   // 何日挑戦して届かなければ「仮通過」のボタンを出すか（0＝いつでも出す）
  };
  var MARU = ["","①","②","③","④","⑤","⑥","⑦","⑧","⑨"];
  /* ============================================================ */

  var app = document.getElementById("app");
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  /* 本文：エスケープ＋【見出し】を太字に（改行は CSS の pre-wrap でそのまま表示） */
  function rich(s){
    return esc(s)
      .replace(/(^|\n)(【条件】[^\n]*)(\n|$)/g,'<span class="cond">$2</span>')   // 条件の行を強調
      .replace(/【([^】\n]{1,40})】/g,'<strong>【$1】</strong>');
  }

  /* ---------- v2：並べ替え・論点 ---------- */
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function isOn(v){ var t=String(v==null?"":v).trim(); return t!=="" && t!=="0" && t!=="false"; }
  /* 選択肢の並び：perm[表示位置-1]＝元の選択肢番号。「並び固定」の問題は入れ替えない */
  function makePerm(q){ return isOn(q.fixed) ? [1,2,3,4] : shuffle([1,2,3,4]); }
  function dispOf(perm,orig){ return perm.indexOf(orig)+1; }
  function zen(c){ var i="１２３４".indexOf(c); return i>=0 ? i+1 : parseInt(c,10); }
  /* 解説の「選択肢N」を、画面に出した番号に書き換える。続けて並ぶ「選択肢N：」の行は番号順に並べ直す */
  function mapExp(text,perm){
    var t=String(text==null?"":text).replace(/選択肢\s*([1-4１-４])/g,function(m,c){ return "選択肢"+dispOf(perm,zen(c)); });
    var out=[], run=[];
    function flush(){ run.sort(function(a,b){ return a.n-b.n; }); run.forEach(function(r){ out.push(r.s); }); run=[]; }
    t.split("\n").forEach(function(line){
      var m=line.match(/^選択肢([1-4])[：:]/);
      if(m) run.push({ n:+m[1], s:line }); else { flush(); out.push(line); }
    });
    flush();
    return out.join("\n");
  }
  /* 出題順：同じセット（連問）は順番を守ってひとかたまり。かたまり同士の順番を入れ替える */
  function blockKey(q){
    if(q.set) return "set:"+q.set;
    var p=partByKey(q._pk);
    if(p && p.type==="観点の構築") return "src:"+q.source;
    return null;
  }
  function orderQuestions(qs){
    var blocks=[], last=null;
    qs.forEach(function(q){
      var k=blockKey(q);
      if(k!==null && last && last.k===k) last.qs.push(q);
      else { last={ k:k, qs:[q] }; blocks.push(last); }
    });
    var out=[]; shuffle(blocks).forEach(function(b){ out=out.concat(b.qs); });
    return out;
  }
  /* 論点：「論点」列があればそれ。無ければ解説の「理由：〜」から拾う */
  function pointOf(q){
    if(q.point && String(q.point).trim()) return String(q.point).trim();
    var m=String(q.explanation||"").match(/理由：([^\n]+)/); if(!m) return "";
    var t=m[1].split("（")[0].split("・")[0].trim();
    if(t.indexOf("課題返し")===0) t="課題返し";
    return t;
  }
  /* 先に自分で考えるモード */
  function thinkOn(){ return !!STORE.get("think",false); }
  function thinkApplies(q){ return !/適さない|適切でない|誤っている|誤りは/.test(q.question||""); }

  /* ---------- v4：段階・診断・今日のメニュー ---------- */
  function stageOf(q){
    var v=parseInt(q.stage,10); if(v>=1 && v<=STAGES.length) return v;
    var p=partByKey(q._pk); if(!p) return 0;
    for(var i=0;i<STAGES.length;i++){ if(STAGES[i].types.indexOf(p.type)>=0) return STAGES[i].no; }
    return 0;
  }
  function isKnow(q){ var p=partByKey(q._pk); return !!p && KNOW_TYPES.indexOf(p.type)>=0; }
  function deptQs(dept){ var out=[]; partsInDept(dept).forEach(function(p){ out=out.concat(p.questions||[]); }); return out; }
  function progGet(dept){ var a=STORE.get("prog",{}); return a[dept]||{ start:0, skip:{} }; }
  function progSet(dept,o){ var a=STORE.get("prog",{}); a[dept]=o; STORE.set("prog",a); }
  /* 段階ごと・日ごとの成績。同じ日に同じ問題を何度解いても、最初の1回だけ数える（解き直しで上げられないように） */
  function stageDays(dept){
    var res={}, seen={};
    logAll().forEach(function(e){
      if(e.m==="diag") return;                       // 診断の解答は、合格判定に数えない
      var q=QMAP[e.id]; if(!q) return;
      var p=partByKey(q._pk); if(!p || p.dept!==dept) return;
      var st=stageOf(q); if(!st) return;
      var d=String(e.t).slice(0,10), key=d+"|"+e.id; if(seen[key]) return; seen[key]=1;
      res[st]=res[st]||{}; var r=res[st][d]=res[st][d]||{ n:0, ok:0 }; r.n++; r.ok+=e.o;
    });
    return res;
  }
  /* 各段階の状態：empty＝準備中／pass＝通過／diag＝診断で通過／skip＝仮通過／now＝挑戦中／todo＝これから */
  function stageInfo(dept){
    var pr=progGet(dept), days=stageDays(dept), today=ymd(new Date()), all=deptQs(dept), cur=null;
    var list=STAGES.map(function(sg){
      var total=all.filter(function(q){ return stageOf(q)===sg.no; }).length;
      var need=Math.min(CFG.MIN_N,total), dd=days[sg.no]||{}, passDays=0, tryDays=0;
      Object.keys(dd).forEach(function(d){
        if(dd[d].n>=need && need>0){ tryDays++; if(dd[d].ok/dd[d].n*100>=CFG.PASS_PCT) passDays++; }
      });
      var st = !total ? "empty" : passDays>=CFG.PASS_DAYS ? "pass" : (pr.start>sg.no ? "diag" : (pr.skip&&pr.skip[sg.no] ? "skip" : "todo"));
      return { no:sg.no, name:sg.name, goal:sg.goal, total:total, need:need, passDays:passDays, tryDays:tryDays,
               today:dd[today]||{ n:0, ok:0 }, status:st };
    });
    for(var i=0;i<list.length;i++){ if(list[i].status==="todo"){ list[i].status="now"; cur=list[i]; break; } }
    return { list:list, cur:cur, started:pr.start>0 };
  }
  /* 今の段階までの問題（知識は KNOW_FROM の段階から） */
  function allowedQs(dept, curNo){
    return deptQs(dept).filter(function(q){
      var st=stageOf(q); if(st) return st<=curNo;
      return isKnow(q) && curNo>=CFG.KNOW_FROM;
    });
  }
  function blockOf(q){
    var k=blockKey(q); if(k===null) return [q];
    return (partByKey(q._pk).questions||[]).filter(function(x){ return blockKey(x)===k; });
  }
  /* 今日のメニュー：弱い論点／前に間違えた問題／今の段階の新しい問題 を混ぜる */
  function buildMenu(dept){
    var info=stageInfo(dept), curNo=info.cur ? info.cur.no : STAGES.length;
    var qs=allowedQs(dept,curNo); if(!qs.length) return [];
    var last={}, lastT={};
    logAll().forEach(function(e){ last[e.id]=e.o; lastT[e.id]=e.t; });
    function byOld(a,b){ var x=lastT[a.id]||"", y=lastT[b.id]||""; return x<y?-1:(x>y?1:0); }   // 解いていない／古い順
    var pt={};
    qs.forEach(function(q){ if(last[q.id]===undefined) return; var k=pointOf(q); if(!k) return;
      pt[k]=pt[k]||{ n:0, ok:0 }; pt[k].n++; pt[k].ok+=last[q.id]; });
    var weak=Object.keys(pt).filter(function(k){ return pt[k].n>=3 && pt[k].ok/pt[k].n*100<CFG.PASS_PCT; })
      .sort(function(a,b){ return pt[a].ok/pt[a].n-pt[b].ok/pt[b].n; }).slice(0,3);
    var retry=shuffle(qs.filter(function(q){ return last[q.id]===0; })).sort(byOld);
    var weakQ=shuffle(qs.filter(function(q){ return last[q.id]!==0 && weak.indexOf(pointOf(q))>=0; })).sort(byOld);
    var fresh=shuffle(qs.filter(function(q){ return last[q.id]===undefined && (stageOf(q)===curNo || !stageOf(q)); }));
    var rest=shuffle(qs.filter(function(q){ return stageOf(q)===curNo; })).sort(byOld).concat(shuffle(qs).sort(byOld));

    var units=[], used={}, count=0;
    function take(list,n){
      var got=0;
      for(var i=0;i<list.length && got<n && count<CFG.MENU_N;i++){
        var q=list[i]; if(used[q.id]) continue;
        // 初めて解く連問は、順番どおりにまとめて出す。解いたことのある問題は、1問ずつ出す
        var blk=(last[q.id]===undefined ? blockOf(q) : [q]).filter(function(x){ return !used[x.id]; });
        blk.forEach(function(x){ used[x.id]=1; });
        units.push(blk); got+=blk.length; count+=blk.length;
      }
    }
    var nW=Math.round(CFG.MENU_N*CFG.MIX_WEAK), nR=Math.round(CFG.MENU_N*CFG.MIX_RETRY);
    take(retry,nR); take(weakQ,nW); take(fresh,CFG.MENU_N); take(rest,CFG.MENU_N);
    var out=[]; shuffle(units).forEach(function(u){ out=out.concat(u); });
    return out;
  }
  function startMenu(){
    var qs=buildMenu(S.dept); if(!qs.length) return;
    S.mode="menu"; S.catName="今日のメニュー"; S.qs=qs; S.before=stageInfo(S.dept); beginQuiz();
  }
  /* 診断：各段階から少しずつ出し、最初に届かなかった段階から始める */
  function startDiag(){
    var all=deptQs(S.dept), qs=[];
    STAGES.forEach(function(sg){
      qs=qs.concat(shuffle(all.filter(function(q){ return stageOf(q)===sg.no; })).slice(0,CFG.DIAG_PER));
    });
    if(!qs.length) return;
    S.mode="diag"; S.catName="診断"; S.qs=qs; beginQuiz();
  }
  function finishDiag(qs){
    var r={};
    qs.forEach(function(q,i){ var st=stageOf(q); r[st]=r[st]||{ n:0, ok:0 }; r[st].n++; if(S.answers[i]===q.answer) r[st].ok++; });
    var start=STAGES.length+1;
    for(var i=0;i<STAGES.length;i++){
      var x=r[STAGES[i].no]; if(!x) continue;
      if(x.ok < Math.min(CFG.DIAG_PASS, Math.ceil(x.n*CFG.DIAG_PASS/CFG.DIAG_PER))){ start=STAGES[i].no; break; }
    }
    var pr=progGet(S.dept); pr.start=start; pr.diag={ d:ymd(new Date()), r:r }; pr.skip={};
    progSet(S.dept,pr); S.diagRes={ r:r, start:start };
    go("diagresult");
  }
  var MODE_LABEL={ cat:"カテゴリー", review:"復習", menu:"今日のメニュー", diag:"診断" };
  function pad(n){ return (n<10?"0":"")+n; }
  function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function md(s){ var p=String(s||"").split("-"); return p.length===3? (+p[1])+"/"+(+p[2]) : ""; }
  function stamp(d){ return ymd(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()); }

  /* ---------- データ読み込み ---------- */
  function loadAll(base){
    return fetch(base+"data/manifest.json",{cache:"no-cache"}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(m){
        var parts=(m.parts||[]);
        if(!parts.length) throw 0;
        return Promise.all(parts.map(function(p){
          return fetch(base+"data/"+p.file,{cache:"no-cache"}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
            .then(function(d){
              var qs=(d.questions||[]);
              qs.forEach(function(q){ q._pk=p.key; QMAP[q.id]=q; });
              return Object.assign({}, p, { questions:qs });
            });
        })).then(function(list){
          DATA.exam=m.exam||DATA.exam;
          DATA.parts=list.sort(function(a,b){
            return (a.dept_order-b.dept_order)||(a.type_order-b.type_order)||(a.sheet_no-b.sheet_no); });
        });
      });
  }

  /* ---------- 集計ヘルパ ---------- */
  function depts(){
    var seen={}, out=[];
    DATA.parts.forEach(function(p){ if(!seen[p.dept]){ seen[p.dept]=1; out.push(p.dept); } });
    return out;
  }
  function partsInDept(d){ return DATA.parts.filter(function(p){ return p.dept===d; }); }
  function partByKey(k){ return DATA.parts.filter(function(p){ return p.key===k; })[0]; }
  function partName(p){ return p.type+" "+p.sheet_no; }
  function categoriesOf(k){
    var p=partByKey(k), order=[], cnt={};
    (p.questions||[]).forEach(function(q){ if(cnt[q.category]===undefined){ cnt[q.category]=0; order.push(q.category); } cnt[q.category]++; });
    return order.map(function(name){ return { name:name, count:cnt[name] }; });
  }
  function questionsOf(k, cat){ return (partByKey(k).questions||[]).filter(function(q){ return q.category===cat; }); }

  /* ---------- 記録（解答ごと：日時・解答時間・正誤） ---------- */
  function logAll(){ return STORE.get("log",[]); }
  function logAnswer(q, picked, sec){
    var a=logAll();
    a.push({ id:q.id, k:q._pk, c:q.category, t:stamp(new Date()), s:sec, a:picked, o:(picked===q.answer?1:0), m:S.mode });
    if(a.length>20000) a=a.slice(a.length-20000);
    STORE.set("log",a);
  }
  /* シート（パート）ごと：各問題の最新の解答で集計 */
  function partStat(p){
    var ids={}; (p.questions||[]).forEach(function(q){ ids[q.id]=1; });
    var last={}; logAll().forEach(function(e){ if(ids[e.id]) last[e.id]=e.o; });
    var n=0, ok=0; Object.keys(last).forEach(function(id){ n++; ok+=last[id]; });
    return { done:n, ok:ok, total:(p.questions||[]).length };
  }
  /* カテゴリーごとの直近3回の正答率（右端が最新）と実施日 */
  function histAll(){ return STORE.get("hist",{}); }
  function histGet(part,cat){ var a=histAll(); return (a[part]&&a[part][cat])||[]; }
  function histPush(part,cat,rec){
    var a=histAll(); a[part]=a[part]||{}; var arr=a[part][cat]||[];
    arr.push(rec); if(arr.length>3) arr=arr.slice(arr.length-3);
    a[part][cat]=arr; STORE.set("hist",a);
  }
  function accColor(pct){ return pct<60 ? 'var(--ng)' : (pct<75 ? 'var(--brand)' : 'var(--ink)'); }

  /* ---------- ナビゲーション ---------- */
  function show(){ render(); window.scrollTo(0,0); }   // 描き直すたびに一番上へ
  function go(screen){ S.screen=screen; show(); }

  function openDept(d){ S.dept=d; go("types"); }
  function openPart(k){ S.partKey=k; S.results={}; go("cats"); }
  function beginQuiz(){ S.qIndex=0; S.view="question"; S.answers={}; S.times={}; S.timer=null; S.perms={}; S.revealed={}; go("quiz"); }
  function startCategory(cat){ S.mode="cat"; S.catName=cat; S.qs=orderQuestions(questionsOf(S.partKey,cat)); beginQuiz(); }
  /* 復習：部門の中で、最新の解答が不正解の問題 */
  function wrongIn(dept){
    var last={}; logAll().forEach(function(e){ last[e.id]=e.o; });
    var out=[];
    partsInDept(dept).forEach(function(p){ (p.questions||[]).forEach(function(q){ if(last[q.id]===0) out.push(q); }); });
    return out;
  }
  function startReview(){
    var w=shuffle(wrongIn(S.dept)).slice(0,REVIEW_MAX); if(!w.length) return;
    S.mode="review"; S.catName="復習"; S.qs=w; beginQuiz();
  }
  function quizHome(){ go(S.mode==="cat" ? "cats" : "types"); }

  /* S.answers には「元の選択肢番号」を入れる（画面の番号は perm で変換） */
  function curQuiz(){
    var qs=S.qs, q=qs[S.qIndex];
    if(q && !S.perms[S.qIndex]) S.perms[S.qIndex]=makePerm(q);
    return { qs:qs, q:q, picked:S.answers[S.qIndex], perm:S.perms[S.qIndex] };
  }
  /* 1ステップ移動：戻る＝一つ前の画面 / 次へ＝一つ先の画面（配布版と同じ動き） */
  function stepBack(){
    if(S.view==="explain"){ S.view="question"; }
    else if(S.qIndex>0){ S.qIndex--; S.view="explain"; }
    else { quizHome(); return; }
    show();
  }
  function stepNext(){
    var c=curQuiz();
    if(S.view==="question"){ if(c.picked===undefined) return; S.view="explain"; }
    else if(S.qIndex>=c.qs.length-1){ finishCategory(c.qs); return; }
    else { S.qIndex++; S.view="question"; }
    show();
  }
  function pick(n){
    var c=curQuiz(); if(c.picked!==undefined) return;
    var sec=S.timer&&S.timer.idx===S.qIndex ? Math.round((Date.now()-S.timer.t)/1000) : 0;
    sec=Math.min(sec,3600);
    S.answers[S.qIndex]=n; S.times[S.qIndex]=sec;
    logAnswer(c.q, n, sec);
    S.view="explain"; show();
  }
  document.getElementById("hBack").onclick=function(){ if(S.screen==="quiz") stepBack(); };
  document.getElementById("hNext").onclick=function(){ if(S.screen==="quiz") stepNext(); };

  /* ---------- 画面描画 ---------- */
  function render(){
    document.getElementById("hNav").hidden = (S.screen!=="quiz");
    if(S.screen==="locked"){ return renderLocked(); }
    if(S.screen==="codegate"){ return renderCodeGate(); }
    renderWatermark();
    var lic=[];
    if(LICENSE.name) lic.push("利用者: "+esc(LICENSE.name));
    if(LICENSE.expiry) lic.push("有効期限: "+esc(LICENSE.expiry));
    lic.push("この教材の無断複製・再配布を禁じます。");
    document.getElementById("licBar").innerHTML = lic.join("　/　");

    if(S.screen==="menu") return renderMenu();
    if(S.screen==="types") return renderTypes();
    if(S.screen==="cats") return renderCats();
    if(S.screen==="quiz") return renderQuiz();
    if(S.screen==="catresult") return renderCatResult();
    if(S.screen==="reviewresult") return renderReviewResult();
    if(S.screen==="menuresult") return renderMenuResult();
    if(S.screen==="diagresult") return renderDiagResult();
    if(S.screen==="overall") return renderOverall();
    if(S.screen==="records") return renderRecords();
  }

  function bar(backFn, backLabel, crumb){
    var h='<div class="bar">';
    if(backFn) h+='<button class="back" id="backBtn">‹ '+esc(backLabel||"戻る")+'</button>';
    if(crumb) h+='<span class="crumb">'+esc(crumb)+'</span>';
    h+='</div>';
    return h;
  }
  function wireBack(fn){ var b=document.getElementById("backBtn"); if(b) b.onclick=fn; }
  function wireAll(sel, attr, fn){
    Array.prototype.forEach.call(app.querySelectorAll(sel),function(b){ b.onclick=function(){ fn(b.getAttribute(attr)); }; });
  }

  /* ① トップ：部門 */
  function renderMenu(){
    document.getElementById("hTitle").textContent = DATA.exam;
    var h=bar(null,null,"メインメニュー");
    h+='<div class="card"><div class="note" style="margin-bottom:10px">部門を選んでください。</div><div class="grid">';
    depts().forEach(function(d){
      var n=0; partsInDept(d).forEach(function(p){ n+=(p.questions||[]).length; });
      h+='<button class="menu-btn" data-dept="'+esc(d)+'"><span>'+esc(d)+'</span><span class="sub">'+n+'問 ›</span></button>';
    });
    h+='</div></div>';
    var on=thinkOn();
    h+='<button class="toggle'+(on?' on':'')+'" id="thinkTg"><span>先に自分で考えるモード'+
       '<span class="stat">選択肢を隠して出題します。自分の答えを決めてから選択肢を見ます。</span></span>'+
       '<span class="sw">'+(on?'ON':'OFF')+'</span></button>';
    h+='<button class="ghost" id="toRec" style="width:100%">学習記録を見る</button>';
    app.innerHTML=h;
    document.getElementById("thinkTg").onclick=function(){ STORE.set("think",!thinkOn()); render(); };
    wireAll("[data-dept]","data-dept",openDept);
    document.getElementById("toRec").onclick=function(){ go("records"); };
  }

  /* ② 種別（シートごと。_2 は 0問でも表示） */
  function renderTypes(){
    function typeStage(t){ for(var i=0;i<STAGES.length;i++){ if(STAGES[i].types.indexOf(t)>=0) return STAGES[i].no; } return 99; }
    var ps=partsInDept(S.dept).slice().sort(function(a,b){
      return (typeStage(a.type)-typeStage(b.type))||(a.type_order-b.type_order)||(a.sheet_no-b.sheet_no); });
    var h=bar(function(){ go("menu"); },"メニュー",S.dept+" › 種別選択");
    var info=stageInfo(S.dept), cur=info.cur, hasQ=info.list.some(function(x){ return x.total>0; });
    var canEsc=false;
    if(hasQ){
      h+='<div class="card"><div class="grp" style="margin:0 0 8px">おすすめの進め方</div>';
      if(!info.started){
        var dn=0; info.list.forEach(function(x){ dn+=Math.min(CFG.DIAG_PER,x.total); });
        h+='<div class="note" style="margin-bottom:10px">最初に診断を受けると、自分に合った段階から始められます。</div>';
        h+='<div class="grid"><button class="primary" id="diagBtn">診断を受ける（'+dn+'問）</button>'+
           '<button class="ghost" id="noDiagBtn">診断を受けずに、段階①から始める</button></div>';
      } else {
        if(cur){
          var tp=cur.today.n ? Math.round(cur.today.ok/cur.today.n*100) : 0;
          h+='<div style="font-weight:700">今の段階：'+MARU[cur.no]+' '+esc(cur.name)+'</div>';
          h+='<div class="note">'+esc(cur.goal)+'</div>';
          h+='<div class="note" style="margin:6px 0 10px">合格日 '+cur.passDays+' / '+CFG.PASS_DAYS+
             '　（今日：'+cur.today.n+'問'+(cur.today.n?'・'+tp+'%':'')+'　基準：1日'+cur.need+'問以上で'+CFG.PASS_PCT+'%以上）</div>';
          canEsc=(cur.tryDays>=CFG.ESCAPE_AFTER_DAYS);
        } else {
          h+='<div style="font-weight:700;margin-bottom:10px">すべての段階を通過しました。全範囲から出題します。</div>';
        }
        h+='<button class="primary" id="menuBtn" style="width:100%">今日のメニューを始める（'+CFG.MENU_N+'問）</button>';
        h+='<table style="margin-top:12px"><tr><th>段階</th><th>状態</th></tr>';
        info.list.forEach(function(x){
          var lab = x.status==="empty" ? '<span style="color:var(--sub)">準備中</span>' :
                    x.status==="pass"  ? '<span style="color:#00872f;font-weight:700">通過</span>' :
                    x.status==="diag"  ? '<span style="color:#00872f">診断で通過</span>' :
                    x.status==="skip"  ? '<span style="color:#e65100">仮通過（基準は未達）</span>' :
                    x.status==="now"   ? '<span style="color:var(--brand-d);font-weight:700">挑戦中（合格日 '+x.passDays+'/'+CFG.PASS_DAYS+'）</span>' :
                                         '<span style="color:var(--sub)">これから</span>';
          h+='<tr><td>'+MARU[x.no]+' '+esc(x.name)+'</td><td>'+lab+'</td></tr>';
        });
        h+='</table>';
        if(canEsc) h+='<div class="note" style="margin-top:10px">この段階に'+cur.tryDays+'日挑戦しています。基準に届かなくても、先へ進めます。'+
           '仮通過にした段階の問題は、今日のメニューに出続けます。基準に届いた時点で「通過」に変わります。</div>'+
           '<button class="ghost" id="escBtn" style="width:100%;margin-top:6px">この段階を仮通過にして、次へ進む</button>';
        h+='<button class="back" id="rediagBtn" style="margin-top:12px">診断をやり直す</button>';
      }
      h+='</div>';
    }
    h+='<div class="card"><div class="grp" style="margin:0 0 8px">自由に解く（種別から選ぶ）</div><div class="grid">';
    var lastType=null;
    ps.forEach(function(p){
      if(p.type!==lastType){ h+='<div class="grp">'+esc(p.type)+'</div>'; lastType=p.type; }
      var n=(p.questions||[]).length;
      if(!n){
        h+='<button class="menu-btn empty" data-k="'+esc(p.key)+'"><span>'+esc(partName(p))+'</span><span class="sub">(0) ›</span></button>';
        return;
      }
      var st=partStat(p);
      var stat = st.done ? '解答済 '+st.done+'/'+st.total+'・正答率 '+Math.round(st.ok/st.done*100)+'%' : '未着手';
      h+='<button class="menu-btn" data-k="'+esc(p.key)+'"><span>'+esc(partName(p))+
         '<span class="stat">'+esc(stat)+'</span></span><span class="sub">'+n+'問 ›</span></button>';
    });
    h+='</div></div>';
    var wn=wrongIn(S.dept).length;
    if(wn) h+='<button class="ghost" id="revBtn" style="width:100%">間違えた問題を復習する（'+wn+'問'+(wn>REVIEW_MAX?'のうち'+REVIEW_MAX+'問':'')+'）</button>';
    app.innerHTML=h; wireBack(function(){ go("menu"); });
    if(wn) document.getElementById("revBtn").onclick=startReview;
    function on(id,fn){ var b=document.getElementById(id); if(b) b.onclick=fn; }
    on("diagBtn",startDiag); on("rediagBtn",startDiag); on("menuBtn",startMenu);
    on("noDiagBtn",function(){ var pr=progGet(S.dept); pr.start=1; progSet(S.dept,pr); render(); });
    on("escBtn",function(){
      var b=document.getElementById("escBtn");
      if(!b.getAttribute("data-sure")){ b.setAttribute("data-sure","1"); b.textContent="本当に仮通過にする（もう一度押す）"; return; }
      var pr=progGet(S.dept); pr.skip=pr.skip||{}; pr.skip[cur.no]=ymd(new Date()); progSet(S.dept,pr); show();
    });
    wireAll("[data-k]","data-k",openPart);
  }

  /* ③ カテゴリー */
  function renderCats(){
    var p=partByKey(S.partKey), cats=categoriesOf(S.partKey);
    var crumb=p.dept+" › "+partName(p)+" › カテゴリー選択";
    var h=bar(function(){ go("types"); },"戻る",crumb);
    h+='<div class="card">';
    if(!cats.length){
      h+='<div class="note">このシートには、まだ問題がありません（追加用のシート）。</div></div>';
      app.innerHTML=h; wireBack(function(){ go("types"); }); return;
    }
    if(p.type==="観点の構築") h+='<div class="note" style="margin-bottom:8px">連問です。手順1から順に出題します。</div>';
    h+='<div class="note" style="margin-bottom:8px">各カテゴリーの直近3回の正答率（右端が最新）</div>';
    h+='<div class="grid">';
    cats.forEach(function(c){
      var hist=histGet(S.partKey,c.name), cells=['','',''];
      for(var i=0;i<hist.length&&i<3;i++){ cells[2-i]=hist[hist.length-1-i].p; }
      var last=hist.length? hist[hist.length-1] : null;
      var accHtml=cells.map(function(v){
        if(v===''||v===undefined) return '<span class="acc empty">—</span>';
        return '<span class="acc" style="color:'+accColor(v)+(v>=75?';font-weight:700':'')+'">'+v+'%</span>';
      }).join('');
      h+='<button class="catrow" data-cat="'+esc(c.name)+'">'+
           '<span class="cname">'+esc(c.name)+(last?'<span class="cdate">最終 '+esc(md(last.d))+'</span>':'')+'</span>'+
           '<span class="ccount">'+c.count+'問</span>'+accHtml+
         '</button>';
    });
    h+='</div>';
    var allDone = cats.every(function(c){ return S.results[c.name]; });
    if(allDone) h+='<button class="primary" id="overBtn" style="margin-top:12px;width:100%">このシートの総合結果を見る</button>';
    h+='</div>';
    app.innerHTML=h; wireBack(function(){ go("types"); });
    if(allDone) document.getElementById("overBtn").onclick=function(){ go("overall"); };
    wireAll("[data-cat]","data-cat",startCategory);
  }

  /* ④ 問題・解説 */
  function renderQuiz(){
    var c=curQuiz(), qs=c.qs, q=c.q, picked=c.picked, perm=c.perm;
    var p=partByKey(q._pk);
    var last=(S.qIndex>=qs.length-1);
    var isRev=(S.mode!=="cat");
    var crumb=isRev ? p.dept+" › "+MODE_LABEL[S.mode]+" › "+partName(p)+"・"+q.category : p.dept+" › "+partName(p)+" › "+S.catName;
    var homeLabel=isRev ? "種別選択" : "カテゴリー一覧";
    var h=bar(quizHome,homeLabel,crumb);

    // 青帯のボタン
    document.getElementById("hPos").textContent = (S.qIndex+1)+" / "+qs.length+(S.view==="explain"&&picked!==undefined?"　解説":"　問題");
    var hn=document.getElementById("hNext");
    var isExp=(picked!==undefined && S.view==="explain");
    hn.disabled = (picked===undefined);
    hn.textContent = isExp && last ? "結果へ ›" : "次へ ›";

    var backBtn='<button class="navback" id="stepBack">‹ 戻る</button>';
    var tags='<div class="meta"><span class="tag">'+esc(q.id)+'</span>'+(q.source?'<span class="tag">'+esc(q.source)+'</span>':'')+'</div>';

    // 解説ビュー（解答済み）
    if(isExp){
      var ok=picked===q.answer;
      var pt=pointOf(q);
      h+='<div class="card">'+tags.replace(/<\/div>$/, (pt?'<span class="tag">論点：'+esc(pt)+'</span>':'')+'</div>');
      h+='<div class="verdict '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解")+'（あなた: '+dispOf(perm,picked)+' ／ 正答: '+dispOf(perm,q.answer)+'）</div>';
      h+='<div class="vsub">解答時間 '+(S.times[S.qIndex]!=null? S.times[S.qIndex]+'秒' : '—')+'</div>';
      h+='<div class="explain"><h4>解説</h4><div class="exp-body">'+rich(mapExp(q.explanation,perm))+'</div></div>';
      h+='<div class="nav">'+backBtn+'<span class="spacer"></span>'+
         '<button class="primary" id="stepNext">'+(last?(isRev?"結果へ":"カテゴリーの結果へ"):"次へ ›")+'</button></div>';
      h+='</div>';
      app.innerHTML=h; wireBack(quizHome);
      document.getElementById("stepBack").onclick=stepBack;
      document.getElementById("stepNext").onclick=stepNext;
      return;
    }

    // 問題ビュー（未解答＝選択可能／解答済＝見直し）
    if(picked===undefined && !(S.timer && S.timer.idx===S.qIndex)) S.timer={ idx:S.qIndex, t:Date.now() };
    h+='<div class="card">'+tags;
    h+='<p class="qtext">'+rich(q.question)+'</p>';
    var hide=(picked===undefined && thinkOn() && thinkApplies(q) && !S.revealed[S.qIndex]);
    if(hide){
      h+='<div class="think"><div class="note" style="margin-bottom:10px">選択肢を見る前に、自分の答えを決めてください（頭の中か、紙に書く）。</div>'+
         '<button class="primary" id="reveal" style="width:100%">答えを決めた → 選択肢を見る</button></div>';
    } else {
      h+='<div class="choices">';
      [1,2,3,4].forEach(function(n){
        var o=perm[n-1];   // 画面の n 番目に出す、元の選択肢番号
        var cls="choice"; var answered=(picked!==undefined);
        if(answered){ cls+=" disabled"; if(o===q.answer) cls+=" correct"; else if(o===picked) cls+=" wrong"; }
        h+='<button class="'+cls+'" data-n="'+o+'"><span class="num">'+n+'.</span><span class="ctext">'+esc(q["choice_"+o]||"")+'</span></button>';
      });
      h+='</div>';
    }
    h+='<div class="nav" style="margin-top:14px">'+backBtn+'<span class="spacer"></span>';
    if(picked!==undefined){ h+='<button class="primary" id="stepNext">解説へ ›</button>'; }
    h+='</div></div>';
    app.innerHTML=h; wireBack(quizHome);
    document.getElementById("stepBack").onclick=stepBack;
    if(hide){
      document.getElementById("reveal").onclick=function(){ S.revealed[S.qIndex]=1; render(); };
    } else if(picked===undefined){
      wireAll(".choice","data-n",function(v){ pick(parseInt(v,10)); });
    } else {
      document.getElementById("stepNext").onclick=stepNext;
    }
  }

  function finishCategory(qs){
    var correct=0, tsum=0, tn=0;
    qs.forEach(function(q,i){ if(S.answers[i]===q.answer) correct++; if(S.times[i]!=null){ tsum+=S.times[i]; tn++; } });
    var pct=Math.round(correct/qs.length*100);
    if(S.mode==="diag"){ finishDiag(qs); return; }
    if(S.mode==="menu"){ S.menuRes={ correct:correct, total:qs.length, avg:(tn?Math.round(tsum/tn):null),
        wrong:qs.filter(function(q,i){ return S.answers[i]!==q.answer; }) }; go("menuresult"); return; }
    if(S.mode==="review"){ S.reviewRes={ correct:correct, total:qs.length }; go("reviewresult"); return; }
    S.results[S.catName]={ correct:correct, total:qs.length, avg:(tn?Math.round(tsum/tn):null) };
    histPush(S.partKey, S.catName, { p:pct, d:ymd(new Date()) });
    go("catresult");
  }

  /* ⑤ カテゴリーの結果 */
  function renderCatResult(){
    var res=S.results[S.catName], pct=Math.round(res.correct/res.total*100);
    var cats=categoriesOf(S.partKey);
    var curIdx=-1;
    for(var ci=0; ci<cats.length; ci++){ if(cats[ci].name===S.catName){ curIdx=ci; break; } }
    var nextCat=(cats.length>1 && curIdx>=0) ? cats[(curIdx+1)%cats.length] : null;
    var allDone=cats.every(function(c){ return S.results[c.name]; });
    var h=bar(function(){ go("cats"); },"カテゴリー一覧",S.catName+" の結果");
    h+='<div class="card center">';
    h+='<div class="note">'+esc(S.catName)+' の正答率</div>';
    h+='<div class="pct">'+pct+'%</div>';
    h+='<div class="note">'+res.correct+' / '+res.total+' 問正解'+(res.avg!=null?'　平均解答時間 '+res.avg+'秒':'')+'</div>';
    h+='<div class="nav" style="margin-top:16px;justify-content:center">';
    if(nextCat) h+='<button class="primary" id="nextCat">次のカテゴリーへ ›</button>';
    if(allDone) h+='<button class="primary" id="toOverall">総合結果を見る ›</button>';
    h+='<button class="ghost" id="toCats">カテゴリー一覧へ</button>';
    h+='</div></div>';
    app.innerHTML=h; wireBack(function(){ go("cats"); });
    if(nextCat) document.getElementById("nextCat").onclick=function(){ startCategory(nextCat.name); };
    if(allDone) document.getElementById("toOverall").onclick=function(){ go("overall"); };
    document.getElementById("toCats").onclick=function(){ go("cats"); };
  }

  /* ⑤' 復習の結果 */
  function renderReviewResult(){
    var res=S.reviewRes, rest=wrongIn(S.dept).length;
    var h=bar(function(){ go("types"); },"種別選択","復習の結果");
    h+='<div class="card center">';
    h+='<div class="note">復習の正答率</div><div class="pct">'+Math.round(res.correct/res.total*100)+'%</div>';
    h+='<div class="note">'+res.correct+' / '+res.total+' 問正解　／　まだ間違えたままの問題：'+rest+'問</div>';
    h+='<div class="nav" style="margin-top:16px;justify-content:center">';
    if(rest) h+='<button class="primary" id="again">続けて復習する ›</button>';
    h+='<button class="ghost" id="toTypes">種別選択へ</button></div></div>';
    app.innerHTML=h; wireBack(function(){ go("types"); });
    if(rest) document.getElementById("again").onclick=startReview;
    document.getElementById("toTypes").onclick=function(){ go("types"); };
  }

  /* 今日のメニューの結果 */
  function renderMenuResult(){
    var res=S.menuRes, info=stageInfo(S.dept), before=S.before||info;
    var h=bar(function(){ go("types"); },"種別選択","今日のメニューの結果");
    h+='<div class="card center"><div class="note">今日のメニューの正答率</div>';
    h+='<div class="pct">'+Math.round(res.correct/res.total*100)+'%</div>';
    h+='<div class="note">'+res.correct+' / '+res.total+' 問正解'+(res.avg!=null?'　平均解答時間 '+res.avg+'秒':'')+'</div></div>';
    h+='<div class="card">';
    var b=before.cur, a=b ? info.list[b.no-1] : null;
    if(a){
      var tp=a.today.n ? Math.round(a.today.ok/a.today.n*100) : 0;
      h+='<div style="font-weight:700">段階'+MARU[a.no]+' '+esc(a.name)+'</div>';
      h+='<div class="note" style="margin:4px 0 8px">今日：'+a.today.n+'問・'+tp+'%（その日の最初の解答で数えます）</div>';
      if(a.status==="pass" && b.status!=="pass"){
        h+='<div class="verdict ok">この段階を通過しました。'+(info.cur?'次は 段階'+MARU[info.cur.no]+' '+esc(info.cur.name)+' です。':'')+'</div>';
      } else if(a.today.n<a.need){
        h+='<div class="note">今日の判定には、この段階の問題があと'+(a.need-a.today.n)+'問必要です。もう1セット解くと届きます。</div>';
      } else if(tp>=CFG.PASS_PCT){
        h+='<div class="verdict ok">今日は合格日です（合格日 '+a.passDays+' / '+CFG.PASS_DAYS+'）。'+
           (a.passDays<CFG.PASS_DAYS?'別の日にもう一度届けば、通過です。':'')+'</div>';
      } else {
        h+='<div class="note">今日は基準（'+CFG.PASS_PCT+'%）に届いていません。まだ解いていない問題に正解すれば、今日の成績は上がります。同じ問題の解き直しは数えません。</div>';
      }
    }
    var pc={}; res.wrong.forEach(function(q){ var k=pointOf(q)||"（論点なし）"; pc[k]=(pc[k]||0)+1; });
    var ks=Object.keys(pc).sort(function(x,y){ return pc[y]-pc[x]; });
    if(ks.length){
      h+='<div class="grp" style="margin:12px 0 6px">今回、間違えた論点</div><table>';
      ks.forEach(function(k){ h+='<tr><td>'+esc(k)+'</td><td class="num-c">'+pc[k]+'問</td></tr>'; });
      h+='</table><div class="note" style="margin-top:6px">次のメニューで、この論点を多めに出します。</div>';
    }
    h+='<div class="nav" style="margin-top:14px;justify-content:center">'+
       '<button class="primary" id="again">もう1セット解く ›</button><button class="ghost" id="toTypes">段階の一覧へ</button></div></div>';
    app.innerHTML=h; wireBack(function(){ go("types"); });
    document.getElementById("again").onclick=startMenu;
    document.getElementById("toTypes").onclick=function(){ go("types"); };
  }
  /* 診断の結果 */
  function renderDiagResult(){
    var d=S.diagRes, info=stageInfo(S.dept);
    var h=bar(function(){ go("types"); },"種別選択","診断の結果");
    h+='<div class="card"><table><tr><th>段階</th><th class="num-c">正解</th><th>判定</th></tr>';
    STAGES.forEach(function(sg){
      var x=d.r[sg.no];
      if(!x){ h+='<tr><td>'+MARU[sg.no]+' '+esc(sg.name)+'</td><td class="num-c">—</td><td style="color:var(--sub)">準備中</td></tr>'; return; }
      var ok = sg.no<d.start;
      h+='<tr><td>'+MARU[sg.no]+' '+esc(sg.name)+'</td><td class="num-c">'+x.ok+' / '+x.n+'</td><td>'+
         (ok?'<span style="color:#00872f">通過</span>':(sg.no===d.start?'<strong>ここから始める</strong>':'<span style="color:var(--sub)">これから</span>'))+'</td></tr>';
    });
    h+='</table>';
    h+='<div style="font-weight:700;margin-top:12px">'+(info.cur?'段階'+MARU[info.cur.no]+' '+esc(info.cur.name)+' から始めます。':'すべての段階が基準に届いています。全範囲から出題します。')+'</div>';
    h+='<div class="note" style="margin-top:4px">各段階の最初に届かなかったところから始めます。後ろの段階で正解していても、前の段階から順に固めます。</div>';
    h+='<div class="nav" style="margin-top:14px;justify-content:center">'+
       '<button class="primary" id="goMenu">今日のメニューを始める ›</button><button class="ghost" id="toTypes">段階の一覧へ</button></div></div>';
    app.innerHTML=h; wireBack(function(){ go("types"); });
    document.getElementById("goMenu").onclick=startMenu;
    document.getElementById("toTypes").onclick=function(){ go("types"); };
  }

  /* ⑥ シート（セクション）の総合結果 */
  function renderOverall(){
    var p=partByKey(S.partKey), cats=categoriesOf(S.partKey);
    var tc=0, tt=0;
    var rows=cats.map(function(c){
      var r=S.results[c.name]||{correct:0,total:c.count};
      tc+=r.correct; tt+=r.total;
      return '<tr><td>'+esc(c.name)+'</td><td class="center">'+r.correct+' / '+r.total+
             '</td><td class="center">'+Math.round(r.correct/r.total*100)+'%</td></tr>';
    }).join("");
    var totpct = tt? Math.round(tc/tt*100):0;
    var h=bar(function(){ go("cats"); },"カテゴリー一覧",p.dept+" › "+partName(p)+" › 総合結果");
    h+='<div class="card">';
    h+='<div class="center"><div class="note">'+esc(partName(p))+' 全体の正答率</div><div class="pct">'+totpct+'%</div>'+
       '<div class="note">'+tc+' / '+tt+' 問正解</div></div>';
    h+='<table style="margin-top:14px"><tr><th>カテゴリー</th><th class="center">正解</th><th class="center">正答率</th></tr>'+rows+
       '<tr><th>合計</th><th class="center">'+tc+' / '+tt+'</th><th class="center">'+totpct+'%</th></tr></table>';
    h+='<button class="primary" id="home" style="margin-top:16px;width:100%">最初の画面に戻る</button>';
    h+='</div>';
    app.innerHTML=h; wireBack(function(){ go("cats"); });
    document.getElementById("home").onclick=function(){
      S.dept=null; S.partKey=null; S.catName=null; S.results={}; go("menu");
    };
  }

  /* ⑦ 学習記録（実施日・解答数・正答率・平均解答時間） */
  function renderRecords(){
    var logs=logAll(), byDay={}, days=[];
    logs.forEach(function(e){
      var d=String(e.t).slice(0,10);
      if(!byDay[d]){ byDay[d]={ n:0, ok:0, s:0 }; days.push(d); }
      byDay[d].n++; byDay[d].ok+=e.o; byDay[d].s+=(e.s||0);
    });
    days.sort().reverse();
    var today=new Date(); today.setHours(0,0,0,0);
    var d14=0; for(var i=0;i<14;i++){ var t=new Date(today.getTime()-i*86400000); if(byDay[ymd(t)]) d14++; }
    var totS=0, totOk=0; logs.forEach(function(e){ totS+=(e.s||0); totOk+=e.o; });
    var h=bar(function(){ go("menu"); },"メニュー","学習記録");
    h+='<div class="card">';
    h+='<div class="kpis">'+
       '<div class="kpi"><b>'+d14+'<small style="font-size:.6em">/14日</small></b><span>直近2週間の学習日数</span></div>'+
       '<div class="kpi"><b>'+logs.length+'</b><span>累計の解答数</span></div>'+
       '<div class="kpi"><b>'+(logs.length?Math.round(totS/logs.length):'—')+'<small style="font-size:.6em">秒</small></b><span>平均解答時間</span></div>'+
       '</div>';
    if(!days.length){ h+='<div class="note">まだ記録がありません。</div>'; }
    else{
      h+='<table><tr><th>実施日</th><th class="num-c">解答数</th><th class="num-c">正答率</th><th class="num-c">平均時間</th></tr>';
      days.slice(0,30).forEach(function(d){ var r=byDay[d];
        h+='<tr><td>'+esc(d)+'</td><td class="num-c">'+r.n+'</td><td class="num-c">'+Math.round(r.ok/r.n*100)+'%</td><td class="num-c">'+Math.round(r.s/r.n)+'秒</td></tr>';
      });
      h+='</table><div class="note" style="margin-top:8px">記録はこの端末だけに保存されます（直近30日分を表示）。</div>';
    }
    h+='</div>';

    // 論点別（各問題の最新の解答で集計。正答率の低い順＝弱点が上）
    var lastE={}; logs.forEach(function(e){ lastE[e.id]=e; });
    var pt={};
    Object.keys(lastE).forEach(function(id){
      var q=QMAP[id]; if(!q) return;
      var name=pointOf(q); if(!name) return;
      pt[name]=pt[name]||{ n:0, ok:0 }; pt[name].n++; pt[name].ok+=lastE[id].o;
    });
    var prow=Object.keys(pt).map(function(k){ return { k:k, n:pt[k].n, pct:Math.round(pt[k].ok/pt[k].n*100) }; })
      .sort(function(a,b){ return (a.pct-b.pct)||(b.n-a.n); });
    if(prow.length){
      h+='<div class="card"><div class="grp" style="margin:0 0 8px">論点別の正答率（低い順）</div>';
      h+='<table><tr><th>論点</th><th class="num-c">解答済</th><th class="num-c">正答率</th></tr>';
      prow.forEach(function(r){
        h+='<tr><td>'+esc(r.k)+'</td><td class="num-c">'+r.n+'問</td><td class="num-c" style="color:'+accColor(r.pct)+'">'+r.pct+'%</td></tr>';
      });
      h+='</table><div class="note" style="margin-top:8px">各問題の最新の解答で集計しています。</div></div>';
    }
    depts().forEach(function(d){
      var inf=stageInfo(d); if(!inf.started) return;
      h+='<div class="card"><div class="grp" style="margin:0 0 8px">段階の状況（'+esc(d)+'）</div>';
      h+='<table><tr><th>段階</th><th>状態</th><th class="num-c">合格日</th><th class="num-c">挑戦日</th></tr>';
      inf.list.forEach(function(x){
        var lab={ empty:"準備中", pass:"通過", diag:"診断で通過", skip:"仮通過", now:"挑戦中", todo:"これから" }[x.status];
        h+='<tr><td>'+MARU[x.no]+' '+esc(x.name)+'</td><td>'+lab+'</td><td class="num-c">'+x.passDays+'</td><td class="num-c">'+x.tryDays+'</td></tr>';
      });
      h+='</table></div>';
    });
    if(logs.length) h+='<button class="ghost" id="csvBtn" style="width:100%">記録をCSVで保存する（指導者に送る用）</button>';
    app.innerHTML=h; wireBack(function(){ go("menu"); });
    if(logs.length) document.getElementById("csvBtn").onclick=exportCsv;
  }
  function exportCsv(){
    var rows=[["日時","ID","シート","カテゴリー","論点","選んだ選択肢（元の番号）","正誤","解答秒","段階","出題"]];
    logAll().forEach(function(e){
      var q=QMAP[e.id];
      rows.push([e.t, e.id, e.k||"", e.c||"", q?pointOf(q):"", e.a, e.o?"○":"×", e.s, q?(stageOf(q)||""):"", MODE_LABEL[e.m]||""]);
    });
    // 段階の状況（指導者が、どこで止まっているかを見る用）
    depts().forEach(function(d){
      var inf=stageInfo(d); if(!inf.started) return;
      inf.list.forEach(function(x){
        var lab={ empty:"準備中", pass:"通過", diag:"診断で通過", skip:"仮通過", now:"挑戦中", todo:"これから" }[x.status];
        rows.push(["#段階の状況", d, MARU[x.no]+" "+x.name, lab, "合格日 "+x.passDays, "挑戦日 "+x.tryDays, "", "", x.no, ""]);
      });
    });
    var csv=rows.map(function(r){
      return r.map(function(v){ return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'; }).join(",");
    }).join("\r\n");
    var blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="drill_record_"+ymd(new Date())+".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
  }

  /* ---------- ライセンス ---------- */
  function renderWatermark(){
    var wm=document.getElementById("wm");
    if(wm.dataset.done) return;
    var name=LICENSE.name||"";
    if(!name){ return; }
    var h="";
    for(var y=-100;y<1400;y+=140){ for(var x=-100;x<1400;x+=360){
      h+='<div style="top:'+y+'px;left:'+x+'px">'+esc(name)+'</div>';
    }}
    wm.innerHTML=h; wm.dataset.done="1";
  }
  function renderLocked(){
    document.getElementById("licBar").innerHTML="";
    app.innerHTML='<div class="card center"><h2 style="color:var(--ng)">利用期限が切れています</h2>'+
      '<p class="note">この教材の有効期限（'+esc(LICENSE.expiry)+'）を過ぎています。</p></div>';
  }
  function renderCodeGate(){
    document.getElementById("licBar").innerHTML="";
    app.innerHTML='<div class="card"><h3>アクセスコードの入力</h3>'+
      '<input type="password" id="code" placeholder="アクセスコード" autocomplete="off">'+
      '<div id="cerr" class="note" style="color:var(--ng);min-height:18px;margin-top:6px"></div>'+
      '<button class="primary" id="enter" style="width:100%">開始する</button></div>';
    var inp=document.getElementById("code");
    function submit(){
      if(inp.value===LICENSE.accessCode){ unlocked=true; go("menu"); }
      else document.getElementById("cerr").textContent="コードが違います。";
    }
    document.getElementById("enter").onclick=submit;
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter") submit(); });
    inp.focus();
  }
  function gate(){
    if(LICENSE.expiry){
      var today=new Date(); today.setHours(0,0,0,0);
      var exp=new Date(LICENSE.expiry+"T23:59:59");
      if(!isNaN(exp.getTime()) && today>exp){ go("locked"); return; }
    }
    if(LICENSE.accessCode && !unlocked){ go("codegate"); return; }
    go("menu");
  }

  /* ---------- 起動 ---------- */
  app.innerHTML='<div class="card note">読み込み中…</div>';
  (function tryLoad(k){
    if(k>=BASE_CANDIDATES.length){
      app.innerHTML='<div class="card note">データを読み込めませんでした。ローカルの file:// で開いている場合は、'+
        'ローカルサーバー配信またはGitHub Pagesでご利用ください。</div>'; return;
    }
    loadAll(BASE_CANDIDATES[k]).then(gate).catch(function(){ tryLoad(k+1); });
  })(0);
})();
</script>
</body>
